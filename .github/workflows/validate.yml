name: Validate Dotfiles

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning
          ignore_paths: |
            config/fish
            misc

  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required directories
        run: |
          echo "Verificando estrutura de diretórios..."

          required_dirs=(
            "config"
            "scripts/setup"
            "scripts/lib"
            "pkgs/yay"
            "pkgs/flatpak"
            "system/etc"
            "docs"
          )

          missing=0
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Diretório obrigatório não encontrado: $dir"
              missing=$((missing + 1))
            else
              echo "✓ $dir"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "Erro: $missing diretórios obrigatórios ausentes"
            exit 1
          fi

          echo "✓ Estrutura de diretórios OK"

      - name: Check required files
        run: |
          echo "Verificando arquivos obrigatórios..."

          required_files=(
            "README.md"
            "install.sh"
            "pkgs/yay/pkglist.txt"
            "pkgs/flatpak/flatpaklist.txt"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Arquivo obrigatório não encontrado: $file"
              missing=$((missing + 1))
            else
              echo "✓ $file"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "Erro: $missing arquivos obrigatórios ausentes"
            exit 1
          fi

          echo "✓ Arquivos obrigatórios OK"

  validate-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check script permissions
        run: |
          echo "Verificando permissões de scripts..."

          scripts=(
            "install.sh"
            scripts/setup/*.sh
            config/scripts/.local/bin/init/*.sh
            config/scripts/.local/bin/utils/*.sh
          )

          errors=0
          for script in ${scripts[@]}; do
            if [ -f "$script" ] && [ ! -x "$script" ]; then
              echo "❌ Script sem permissão de execução: $script"
              errors=$((errors + 1))
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "Erro: $errors scripts sem permissão de execução"
            echo "Execute: chmod +x <script>"
            exit 1
          fi

          echo "✓ Permissões de scripts OK"

      - name: Validate bash syntax
        run: |
          echo "Validando sintaxe de scripts Bash..."

          errors=0
          while IFS= read -r -d '' script; do
            if head -n1 "$script" | grep -qE '#!/.*(bash|sh)'; then
              if ! bash -n "$script" 2>/dev/null; then
                echo "❌ Erro de sintaxe: $script"
                bash -n "$script"
                errors=$((errors + 1))
              else
                echo "✓ $script"
              fi
            fi
          done < <(find scripts config/scripts -type f -name "*.sh" -print0)

          if [ $errors -gt 0 ]; then
            echo "Erro: $errors scripts com erro de sintaxe"
            exit 1
          fi

          echo "✓ Sintaxe de scripts OK"

  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate JSON/JSONC files
        run: |
          echo "Validando arquivos JSON/JSONC..."

          errors=0
          while IFS= read -r -d '' file; do
            # JSONC permite comentários, então removemos antes de validar
            if ! jq empty "$file" 2>/dev/null && ! grep -q '//' "$file"; then
              echo "❌ JSON inválido: $file"
              errors=$((errors + 1))
            else
              echo "✓ $file"
            fi
          done < <(find config -type f \( -name "*.json" -o -name "*.jsonc" \) -print0 2>/dev/null)

          if [ $errors -gt 0 ]; then
            echo "Aviso: $errors arquivos JSON com possíveis problemas"
            # Não falha o build, apenas avisa
          fi

          echo "✓ Validação de JSON concluída"

  conventional-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Validando mensagens de commit..."

          # Conventional Commits pattern
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .{1,100}'

          errors=0
          while IFS= read -r commit; do
            message=$(git log --format=%s -n 1 "$commit")
            
            if ! echo "$message" | grep -qE "$pattern"; then
              echo "❌ Commit inválido: $commit"
              echo "   Mensagem: $message"
              echo "   Deve seguir: tipo(escopo?): descrição"
              echo "   Tipos válidos: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
              errors=$((errors + 1))
            else
              echo "✓ $commit: $message"
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)

          if [ $errors -gt 0 ]; then
            echo ""
            echo "Erro: $errors commits não seguem Conventional Commits"
            echo "Consulte: https://www.conventionalcommits.org/"
            exit 1
          fi

          echo "✓ Todos os commits seguem Conventional Commits"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [shellcheck, validate-structure, validate-scripts, validate-configs]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== Resumo da Validação ==="
          echo ""
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "Estrutura: ${{ needs.validate-structure.result }}"
          echo "Scripts: ${{ needs.validate-scripts.result }}"
          echo "Configs: ${{ needs.validate-configs.result }}"
          echo ""

          if [ "${{ needs.shellcheck.result }}" != "success" ] || \
             [ "${{ needs.validate-structure.result }}" != "success" ] || \
             [ "${{ needs.validate-scripts.result }}" != "success" ]; then
            echo "❌ Algumas validações falharam"
            exit 1
          fi

          echo "✓ Todas as validações passaram!"
