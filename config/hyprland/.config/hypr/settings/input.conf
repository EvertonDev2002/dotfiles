# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = abnt2
    kb_options =
    kb_rules =

    repeat_rate = 35
    repeat_delay = 600

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 significa sem modificação.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Exemplo de configuração por dispositivo
# Veja https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs para mais
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

