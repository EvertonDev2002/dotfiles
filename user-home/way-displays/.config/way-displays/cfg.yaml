# 1. ARRANJO E ALINHAMENTO
# ROW = Um ao lado do outro (Laptop esquerda, HDMI direita)
ARRANGE: ROW
ALIGN: TOP

# 2. ORDEM DOS MONITORES
# Define quem fica na esquerda. Usamos Regex (!^...$) para evitar confusão de nomes.
ORDER:
  - '!^eDP-1$'      # Laptop primeiro (Esquerda / Posição 0)
  - '!^HDMI-A-1$'   # Monitor LG depois (Direita)

# 3. ESCALA (SCALING)
# Ativa escala fracionada.
SCALING: TRUE
# Desativa auto-scale para garantir que ele obedeça a lista manual abaixo.
AUTO_SCALE: FALSE

SCALE:
  # Escala 1.5 para o Laptop
  - NAME_DESC: '!^eDP-1$'
    SCALE: 1.5
  
  # Escala 1.5 para o Monitor LG
  - NAME_DESC: '!^HDMI-A-1$'
    SCALE: 1.5

# 4. RESOLUÇÃO E HZ (MODE)
MODE:
  # Para o Laptop: Usa o máximo disponível (1920x1080@60)
  - NAME_DESC: '!^eDP-1$'
    MAX: TRUE

  # Para o Monitor LG: Força 1920x1080 a 75Hz
  - NAME_DESC: '!^HDMI-A-1$'
    WIDTH: 1920
    HEIGHT: 1080
    HZ: 75

# 5. VRR (ADAPTIVE SYNC)
# O padrão é LIGADO (Enabled).
# Só adicione monitores aqui se quiser DESLIGAR o VRR.
# Como você quer ativado no LG, deixamos essa lista vazia ou comentada.
VRR_OFF:
   - '!^eDP-1$'

# 6. CONFIGURAÇÕES GERAIS
LOG_THRESHOLD: INFO
CALLBACK_CMD: notify-send "way-displays ${CALLBACK_LEVEL}" "${CALLBACK_MSG}"
